# /etc/ups-low-battery/ups_low_battery.conf
# Sourced by ups_low_battery.sh - plain bash variables.

UPS_NAME="nutdev1@localhost"      # or e.g. "cyberpower@192.168.1.50"
THRESHOLD=20                  # fire when battery <= 20%
RECOVER_THRESHOLD=50          # reset trigger when battery >= 50%
POLL_INTERVAL=5              # seconds between polls
SSH_TIMEOUT=10                # per-connection SSH timeout (seconds)
STAGGER_DELAY=10              # seconds to wait after firing each host before the next (0 = back-to-back)
#SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -i /home/pi/.ssh/id_ed25519"
#TARGETS_FILE="/etc/ups_low_battery_targets"
#STATE_DIR="/var/lib/ups_low_battery"   # override if running as a restricted user
